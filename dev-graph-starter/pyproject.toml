[project]
name = "dev-graph-starter"
version = "0.1.0"
description = "Phase 1 dev-workflow graph for the recommendation backend"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.2.50",
  "langgraph-checkpoint-sqlite>=2.0.0",
  "anthropic>=0.40.0",
  "pydantic>=2.7.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]
ignore = ["E501"]
